appId: com.stivo.app
name: Ricerca "maglione" dalla barra della home, filtro per tipo, nessun risultato
tags: [search, smoke]
---
- runFlow:
    file: subflows/fresh_login.yaml
    env:
      EMAIL: alice@boxly.test
      PASSWORD: password123
- tapOn:
    id: "home-search-bar"
- extendedWaitUntil:
    visible:
      id: "search-input"
    timeout: 10000
- assertVisible:
    id: "search-type-all"
- inputText: "maglione"
- extendedWaitUntil:
    visible:
      id: "search-result-22222222-2222-2222-2222-000000000001"
    timeout: 10000
- assertVisible: ".*Inverno 2025.*"
- takeScreenshot: screenshots/07a_search_maglione
# filtro per tipo: Vestiti → resta; Scarpe e accessori (chip visibile senza scroll orizzontale) → nessun risultato
- tapOn:
    id: "search-type-clothing"
- extendedWaitUntil:
    visible:
      id: "search-result-22222222-2222-2222-2222-000000000001"
    timeout: 10000
- tapOn:
    id: "search-type-shoes_accessories"
- extendedWaitUntil:
    visible:
      id: "search-empty"
    timeout: 10000
- tapOn:
    id: "search-type-all"
- tapOn:
    id: "search-result-22222222-2222-2222-2222-000000000001"
- extendedWaitUntil:
    visible:
      id: "item-edit-button"
    timeout: 10000
- runFlow: subflows/go_back.yaml
- tapOn:
    id: "search-input"
- eraseText: 20
- inputText: "zzznonesiste"
- extendedWaitUntil:
    visible:
      id: "search-empty"
    timeout: 10000
- takeScreenshot: screenshots/07b_search_empty
