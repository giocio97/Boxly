appId: host.exp.exponent
name: "Android (Expo Go) smoke v2: login → lista (tab centrale) → dettaglio → QR → barra ricerca + filtro tipo → lingua → logout"
tags: [android, smoke]
---
- runFlow: subflows/open_expo.yaml
# login errato
- tapOn:
    id: "login-email"
- inputText: "alice@boxly.test"
- tapOn:
    id: "login-password"
- inputText: "sbagliata"
- hideKeyboard
- tapOn:
    id: "login-submit"
- extendedWaitUntil:
    visible:
      id: "auth-error"
    timeout: 15000
- takeScreenshot: screenshots/android_01_login_error
# login ok
- tapOn:
    id: "login-password"
- eraseText: 20
- inputText: "password123"
- hideKeyboard
- tapOn:
    id: "login-submit"
- extendedWaitUntil:
    visible:
      id: "box-list"
    timeout: 20000
- assertVisible:
    id: "box-card-11111111-1111-1111-1111-000000000001"
- assertVisible:
    id: "box-card-11111111-1111-1111-1111-000000000002"
- assertNotVisible:
    id: "box-card-11111111-1111-1111-1111-000000000003"
- assertVisible:
    id: "tab-boxes"
- assertVisible:
    id: "tab-scan"
- assertNotVisible:
    id: "tab-search"
- assertVisible:
    id: "home-search-bar"
- assertVisible:
    id: "new-box-button"
- takeScreenshot: screenshots/android_02_box_list
# dettaglio
- tapOn:
    id: "box-card-11111111-1111-1111-1111-000000000001"
- extendedWaitUntil:
    visible:
      id: "box-title"
      text: "Inverno 2025"
    timeout: 15000
- assertVisible:
    id: "role-badge"
- assertVisible:
    id: "add-item-button"
- assertVisible:
    id: "item-row-22222222-2222-2222-2222-000000000001"
- assertVisible:
    id: "item-type-icon-22222222-2222-2222-2222-000000000001"
- takeScreenshot: screenshots/android_03_box_detail
# QR
- tapOn:
    id: "show-qr-button"
- extendedWaitUntil:
    visible:
      id: "qr-code"
    timeout: 15000
- assertVisible:
    id: "print-label-button"
- takeScreenshot: screenshots/android_04_qr
- back
- back
# ricerca dalla barra della home
- extendedWaitUntil:
    visible:
      id: "home-search-bar"
    timeout: 10000
- tapOn:
    id: "home-search-bar"
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible:
      id: "search-input"
    timeout: 10000
- tapOn:
    id: "search-input"
- inputText: "maglione"
- extendedWaitUntil:
    visible:
      id: "search-result-22222222-2222-2222-2222-000000000001"
    timeout: 15000
- assertVisible: ".*Inverno 2025.*"
- hideKeyboard
- tapOn:
    id: "search-type-clothing"
- extendedWaitUntil:
    visible:
      id: "search-result-22222222-2222-2222-2222-000000000001"
    timeout: 10000
- takeScreenshot: screenshots/android_05_search
- back
# tab centrale Scatole riporta alla lista
- tapOn:
    id: "tab-profile"
- tapOn:
    id: "tab-boxes"
- extendedWaitUntil:
    visible:
      id: "box-list"
    timeout: 10000
# lingua: il dispositivo è en-US → l'app parte in inglese; passa a Italiano e torna
- tapOn:
    id: "tab-profile"
- extendedWaitUntil:
    visible:
      id: "lang-it"
    timeout: 10000
- tapOn:
    id: "lang-en"
- extendedWaitUntil:
    visible:
      id: "logout-button"
      text: ".*Log out.*"
    timeout: 5000
- tapOn:
    id: "lang-it"
- extendedWaitUntil:
    visible:
      id: "logout-button"
      text: ".*Esci.*"
    timeout: 5000
- takeScreenshot: screenshots/android_06_lang_it
- tapOn:
    id: "lang-en"
# logout
- assertVisible:
    id: "profile-email"
    text: "alice@boxly.test"
- tapOn:
    id: "logout-button"
- extendedWaitUntil:
    visible:
      id: "login-email"
    timeout: 15000
- takeScreenshot: screenshots/android_07_logged_out
