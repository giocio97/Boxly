appId: com.stivo.app
name: Login alice e lista scatole (mie + condivise)
tags: [auth, smoke]
---
- launchApp:
    clearState: true
- assertVisible:
    id: "login-email"
- runFlow:
    file: subflows/login.yaml
    env:
      EMAIL: alice@boxly.test
      PASSWORD: password123
- extendedWaitUntil:
    visible:
      id: "box-list"
    timeout: 20000
- assertVisible:
    id: "box-card-11111111-1111-1111-1111-000000000001"
- assertVisible:
    id: "box-card-11111111-1111-1111-1111-000000000002"
- assertNotVisible:
    id: "box-card-11111111-1111-1111-1111-000000000003"
- assertVisible:
    id: "tab-scan"
- assertVisible:
    id: "tab-boxes"
- assertNotVisible:
    id: "tab-search"
- assertVisible:
    id: "home-search-bar"
- assertVisible:
    id: "new-box-button"
- assertVisible:
    id: "tab-profile"
- takeScreenshot: screenshots/02_box_list_alice
